[project]
name = "seattle-data-analytics"
version = "0.1.0"
description = "Seattle data analytics with Databricks"
requires-python = ">=3.12"
dependencies = [
    "databricks-connect>=18.0,<18.1",
    "databricks-sdk[notebook]>=0.20.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "pandas>=2.0.0",
    "plotly>=6.6.0",
    "requests>=2.31.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explorations", "transformations", "utilities"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
